[project]
name = "loto-system"
version = "0.1.0"
description = "Research-oriented foundation for LOTO6 and Mini Loto analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "playwright>=1.48.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "scikit-learn>=1.5.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
loto-research = "backend.app.research.cli:main"

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
